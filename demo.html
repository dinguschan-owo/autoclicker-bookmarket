<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #09122c;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
    }

    .half {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .counter-btn {
      background-color: #1d4ed8;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      width: 240px;
      height: 70px;
      font-size: 24px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      box-shadow: none;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .counter-btn:hover {
      background-color: #1e40af;
    }

    .counter-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="half">
    <button class="counter-btn" onclick="this.querySelector('span').textContent++">
      Counter A:&nbsp;<span>0</span>
    </button>
  </div>

  <div class="half">
    <button class="counter-btn" onclick="this.querySelector('span').textContent++">
      Counter B:&nbsp;<span>0</span>
    </button>
  </div>

</body>
</html>
